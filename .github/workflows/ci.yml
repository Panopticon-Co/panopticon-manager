name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout panopticon-agent (for schema contract tests)
        uses: actions/checkout@v4
        with:
          repository: Panopticon-Co/panopticon-agent
          ref: 6e1f0f0944383b0ca330530f75db5a96a8963629
          path: _panopticon-agent-checkout

      - name: Move panopticon-agent to sibling path
        run: mv _panopticon-agent-checkout ../panopticon-agent

      - name: Checkout panopticon-contracts (for response contract tests)
        uses: actions/checkout@v4
        with:
          repository: Panopticon-Co/panopticon-contracts
          ref: df8b2b2692cbcc32088ad5f1f11233d3390ad5af
          path: _panopticon-contracts-checkout

      - name: Move panopticon-contracts to sibling path
        run: mv _panopticon-contracts-checkout ../panopticon-contracts

      - name: Checkout Console response release for cross-repository HTTP qualification
        uses: actions/checkout@v4
        with:
          repository: Panopticon-Co/panopticon-console
          ref: 844fe218f2c91807438f2db65509ee488469f002
          path: _response-console-checkout

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r vendor/eyedetect/requirements.txt

      - name: Lint
        run: |
          ruff check .

      - name: Run test suite
        run: |
          pytest -v tests/

      - name: Verify real Console to Manager response HTTP workflow
        run: python tools/verify_response_console.py --console-dir _response-console-checkout
