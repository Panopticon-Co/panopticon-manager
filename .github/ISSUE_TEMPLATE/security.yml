name: Security Vulnerability
description: Do not file security vulnerabilities as public issues
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities through public GitHub
        issues.**

        `panopticon-manager` sits at the authorization/dispatch boundary of
        the Panopticon pipeline, so vulnerability reports here are treated
        as especially sensitive. Please report privately via GitHub Security
        Advisories instead:

        https://github.com/Panopticon-Co/panopticon-manager/security/advisories/new

        See `SECURITY.md` for what to include in your report.
