name: Feature Request
description: Suggest an enhancement for panopticon-manager
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, or what gap does it fill?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: cross-repo
    attributes:
      label: Cross-Repository Impact
      description: >
        Does this touch the wire contract with panopticon-agent,
        panopticon-linux-agent, panopticon-detection-engine,
        panopticon-response-engine, panopticon-contracts, or
        panopticon-console?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false
